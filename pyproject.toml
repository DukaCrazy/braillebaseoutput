[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = " braillebaseoutput"
version = "0.1.6"
description = "A complete and extensible Unicode Braille processing library."
authors = [
    { name = "Nagao Yuji" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"
keywords = ["braille", "unicode", "accessibility", "API", "binary", "blind", "education"]

[project.urls]
Homepage = "https://github.com/DukaCrazy/braillebaseoutput"
Documentation = "https://github.com/DukaCrazy/braillebaseoutput"
Source = "https://github.com/DukaCrazy/braillebaseoutput"
